<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Stylized Omega & Office Document Symbol -->
  <g transform="translate(256, 252)">
    <!-- Central Shield & Document Silhouette -->
    <path d="M-80,-120 L40,-120 L80,-80 L80,100 C80,115 65,125 50,125 L-80,125 C-95,125 -105,115 -105,100 L-105,-95 C-105,-110 -95,-120 -80,-120 Z" 
          fill="rgba(255,255,255,0.06)" 
          stroke="url(#primaryGlow)" 
          stroke-width="12" 
          stroke-linejoin="round" />
    
    <!-- Document Fold -->
    <path d="M40,-120 L40,-80 L80,-80" fill="none" stroke="url(#primaryGlow)" stroke-width="10" stroke-linejoin="round" />

    <!-- Greek Letter Omega Ribbon (Ω) representing OmniOffice -->
    <path d="M-60,70 L-35,70 C-30,40 -15,10 0,10 C15,10 30,40 35,70 L60,70" 
          fill="none" 
          stroke="url(#primaryGlow)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <circle cx="0" cy="-20" r="46" fill="none" stroke="url(#primaryGlow)" stroke-width="18" stroke-linecap="round" />

    <!-- E2EE Small Emerald Lock / Keyhole in center -->
    <circle cx="0" cy="-20" r="10" fill="#10b981" />
    <path d="M-3,-14 L3,-14 L5,-4 L-5,-4 Z" fill="#10b981" />
  </g>
</svg>
