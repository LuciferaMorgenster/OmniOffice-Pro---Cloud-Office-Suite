<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO Meta Tags -->
    <title>OmniOffice Pro – Enterprise Cloud Office Suite</title>

    <!-- Multilingual SEO Canonical & Alternate Language Annotations -->

    <link rel="alternate" hreflang="en" href="https://omnioffice.app/" />

    <meta property="og:site_name" content="OmniOffice Pro" />

    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <meta name="twitter:title" content="OmniOffice Pro – Enterprise Cloud Office Suite" />

    <!-- Progressive Web App (PWA) Manifest & Native Mobile Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniOffice" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "OmniOffice Pro",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All, Web, iOS, Android, macOS, Windows",
      "inLanguage": ["en", "nl", "de", "fr"],
      "description": "Enterprise cloud office suite for documents, spreadsheets, presentations, and encrypted notes with real-time collaboration, Gemini AI tools, and offline access.",

      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Rich text document word processor with version history",
        "Spreadsheet engine with formula calculations and charts",
        "Interactive presentation slides editor with full-screen playback",
        "Client-side 256-bit AES-GCM End-to-End Encryption with biometric unlock",
        "Gemini 3.8 AI Assistant for text rewriting and data insights",
        "Multi-cloud backup with Google Drive, OneDrive, Dropbox, and Nextcloud",
        "Offline PWA installable application with background synchronization"
      ]
    }
